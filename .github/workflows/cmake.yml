name: CMake Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:

jobs:
  build:
    name: ${{ matrix.config.name }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: true
      matrix:
        config:
        - {
            name: "Windows MSVC 2022",
            os: windows-2022,
            cc: "cl",
            cxx: "cl",
            generator: "Visual Studio 17 2022"
          }
        - {
            name: "Windows MSVC 2026",
            os: windows-2025,
            cc: "cl",
            cxx: "cl",
            generator: "Visual Studio 18 2026"
          }
        - {
            name: "Ubuntu 22 GCC 11",
            os: ubuntu-22.04,
            cc: "gcc",
            cxx: "g++",
            generator: "Ninja"
          }
        - {
            name: "Ubuntu 24 GCC 13",
            os: ubuntu-24.04,
            cc: "gcc",
            cxx: "g++",
            generator: "Ninja"
          }
        - {
            name: "macOS 15 Xcode 16.2 (ARM)",
            os: macos-15,
            cc: "clang",
            cxx: "clang++",
            generator: "Xcode",
            xcode_version: "16.2"
          }
        - {
            name: "macOS 15 Xcode 16.4 (ARM)",
            os: macos-15,
            cc: "clang",
            cxx: "clang++",
            generator: "Xcode",
            xcode_version: "16.4"
          }
        - {
            name: "macOS 26 Xcode 26.5 (ARM)",
            os: macos-26,
            cc: "clang",
            cxx: "clang++",
            generator: "Xcode",
            xcode_version: "26.5"
          }
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v6

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure
      if: runner.os == 'Windows'
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
      run: |
        cmake -B ${{github.workspace}}/build -G "${{ matrix.config.generator }}" -DCMAKE_BUILD_TYPE=${{matrix.build_type }} -A x64

    - name: Configure
      if: runner.os == 'Linux'
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
      run: |
        cmake -B ${{github.workspace}}/build -G "${{ matrix.config.generator }}" -DCMAKE_BUILD_TYPE=${{matrix.build_type }}

    - name: Configure
      if: runner.os == 'macOS'
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
      run: |
        sudo xcode-select --switch /Applications/Xcode_${{ matrix.config.xcode_version }}.app/Contents/Developer
        xcode-select --print-path
        cmake -B ${{github.workspace}}/build -G "${{ matrix.config.generator }}" -DCMAKE_BUILD_TYPE=${{matrix.build_type }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type }}
